name: Build Teli Premium
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;21.4.7075529" || true
          sdkmanager --install "build-tools;33.0.2" || true

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleAfatDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Teli-Premium-APK
          path: TMessagesProj/build/outputs/apk/afat/debug/*.apk
