name: Build Teli APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 3. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Accept Licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 5. Install SDK Packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: 6. Make gradlew executable
        run: chmod +x gradlew

      - name: 7. Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 8. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Teli-APK
          path: TMessagesProj/build/outputs/apk/debug/TMessagesProj_debug.apk
          retention-days: 5
